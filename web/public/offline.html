<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · Study Archive</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <style>
        :root {
            --bg: #0f0f10;
            --surface: #1a1a1c;
            --surface2: #2c2c2e;
            --accent: #5db1ca;
            --text: #ededed;
            --text-dim: #9a9a9d;
        }
        * { box-sizing: border-box; }
        html, body {
            height: 100%;
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
        }
        .wrap {
            min-height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 32px;
            text-align: center;
            gap: 18px;
        }
        .icon {
            width: 64px;
            height: 64px;
            border-radius: 16px;
            background: var(--surface);
            border: 1px solid var(--surface2);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .icon svg { width: 30px; height: 30px; }
        h1 { font-size: 1.15rem; margin: 0; font-weight: 600; }
        p { margin: 0; color: var(--text-dim); font-size: 0.92rem; max-width: 340px; line-height: 1.5; }
        button {
            margin-top: 6px;
            background: var(--surface);
            border: 1px solid var(--surface2);
            color: var(--text);
            padding: 9px 18px;
            border-radius: 9px;
            font-size: 0.88rem;
            cursor: pointer;
        }
        button:hover { border-color: var(--accent); color: var(--accent); }
        a.back { color: var(--accent); text-decoration: none; font-size: 0.85rem; margin-top: 4px; }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="#5db1ca" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 1l22 22" />
                <path d="M8.5 16.5a5 5 0 0 1 7 0" />
                <path d="M5 12.5a9.5 9.5 0 0 1 3.5-2.3" />
                <path d="M15.5 10.2A9.5 9.5 0 0 1 19 12.5" />
                <path d="M2 8.8A13.9 13.9 0 0 1 7 5.5" />
                <path d="M17 5.5a13.9 13.9 0 0 1 5 3.3" />
                <line x1="12" y1="20" x2="12.01" y2="20" />
            </svg>
        </div>
        <h1>You're offline</h1>
        <p>This page hasn't been cached yet, so it isn't available without a connection. Documents you've already opened while online will still work.</p>
        <button onclick="location.reload()">Try again</button>
        <a class="back" href="/">Go to archive home</a>
    </div>
</body>
</html>
